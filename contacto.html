<!doctype html>
<html lang="es" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="title_contact">Contacto - Biopixel</title>
    <meta name="description" content="Contacta a Biopixel para soluciones de agricultura de precisión.">
    <link rel="icon" href="images/logo-48x48.png" type="image/png">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="global.css?v=3.2">
    <script defer src="form-handler.js?v=1.2"></script>
    <script defer src="i18n.js?v=1.3"></script>
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "daa67763f94b4ca7ba2632cd27e6c892"}'></script>
    <style>
        .form-section {
            padding-top: 180px;
            padding-bottom: var(--space-11);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            padding: 0 var(--gutter);
        }

        .form-container h1 {
            font-size: clamp(2.8rem, 7vw, 4.5rem);
            letter-spacing: -0.04em;
            line-height: 0.95;
            margin-bottom: var(--space-8);
            color: var(--text-main);
        }

        .form-container h1 span {
            color: var(--primary);
            font-style: italic;
        }

        .form-group {
            margin-bottom: var(--space-6);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--space-2);
            color: var(--text-secondary);
            font-size: var(--text-label);
            text-transform: uppercase;
            letter-spacing: var(--tracking-label);
            font-weight: 500;
        }

        /* 16px mínimo: evita el zoom automático de iOS al enfocar */
        .form-group input,
        .form-group textarea {
            width: 100%;
            min-height: 48px;
            padding: var(--space-3) 0;
            background-color: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-family: var(--font-text);
            font-size: var(--text-callout);
            transition: border-color var(--duration-base) ease;
            border-radius: 0;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-bottom-color: var(--primary);
            outline: none;
        }

        .form-group input:focus-visible,
        .form-group textarea:focus-visible {
            box-shadow: 0 1px 0 0 var(--primary);
        }

        .form-actions {
            margin-top: var(--space-3);
        }

        #responseMessage {
            margin-top: var(--space-6);
            padding: var(--space-4) var(--space-5);
            display: none;
            font-size: var(--text-footnote);
        }

        #responseMessage.success {
            background-color: var(--primary-ghost);
            color: var(--primary-bright);
            display: block;
            border: 1px solid rgba(148, 148, 199, 0.15);
        }

        #responseMessage.error {
            background-color: rgba(239, 68, 68, 0.05);
            color: var(--error);
            display: block;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body class="i18n-loading">
    <a href="#contenido" class="skip-link" data-i18n="skip_link">Saltar al contenido</a>
    <header class="barra-superior glass" id="page-header">
        <a href="index.html" class="logo-contenedor">
            <img src="images/logo.png" alt="Icono de Biopixel" class="logo-icono">
            <span class="logo-texto">Biopixel</span>
        </a>
        <nav class="nav-desktop" aria-label="Principal">
            <div class="nav-links">
                <a href="index.html#inicio" data-i18n="nav_home">Inicio</a>
                <a href="about.html" data-i18n="nav_about">Nosotros</a>
                <a href="index.html#servicios" data-i18n="nav_services">Servicios</a>
                <a href="contacto.html" class="active" data-i18n="nav_contact">Contacto</a>
            </div>
            <div class="lang-switcher" role="group" aria-label="Idioma">
                <button type="button" onclick="setLanguage('es')" id="lang-es" aria-pressed="false">ES</button>
                <button type="button" onclick="setLanguage('en')" id="lang-en" aria-pressed="false">EN</button>
            </div>
        </nav>
        <button type="button" class="hamburger-button" id="hamburger-button" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-menu">
            <svg width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16m-7 6h7">
                </path>
            </svg>
        </button>
    </header>

    <nav class="mobile-menu glass" id="mobile-menu" aria-label="Menú móvil">
        <a href="index.html#inicio" onclick="closeMobileMenu()" data-i18n="nav_home">Inicio</a>
        <a href="about.html" onclick="closeMobileMenu()" data-i18n="nav_about">Nosotros</a>
        <a href="index.html#servicios" onclick="closeMobileMenu()" data-i18n="nav_services">Servicios</a>
        <a href="contacto.html" onclick="closeMobileMenu()" data-i18n="nav_contact">Contacto</a>
        <div class="mobile-lang" role="group" aria-label="Idioma">
            <button type="button" onclick="setLanguage('es')" id="lang-es-mobile" aria-pressed="false">ES</button>
            <button type="button" onclick="setLanguage('en')" id="lang-en-mobile" aria-pressed="false">EN</button>
        </div>
    </nav>

    <main class="form-section" id="contenido">
        <div class="form-container">
            <span class="eyebrow reveal" data-i18n="nav_contact">Contacto</span>
            <h1 class="reveal reveal-delay-1" data-i18n="contact_heading" data-i18n-html>Hablemos<span>.</span></h1>
            <form id="contactForm">
                <div class="form-group reveal reveal-delay-2">
                    <label for="nombre" data-i18n="form_name">Nombre</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                </div>
                <div class="form-group reveal reveal-delay-2">
                    <label for="email" data-i18n="form_email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="form-group reveal reveal-delay-3">
                    <label for="mensaje" data-i18n="form_message">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" required></textarea>
                </div>
                <div class="form-actions reveal reveal-delay-3">
                    <button type="submit" class="boton boton--block" id="submitButton" data-i18n="form_submit">Enviar</button>
                </div>
            </form>
            <div id="responseMessage" role="status" aria-live="polite"></div>
        </div>
    </main>

    <footer id="page-footer">
        <p data-i18n="footer_text">© 2025 Biopixel. Todos los derechos reservados.</p>
    </footer>

    <script>
        const pageHeader = document.getElementById('page-header');
        const hamburgerBtn = document.getElementById('hamburger-button');
        const mobileMenu = document.getElementById('mobile-menu');

        hamburgerBtn.addEventListener('click', () => {
            const isOpen = mobileMenu.classList.toggle('open');
            pageHeader.classList.toggle('menu-is-open', isOpen);
            hamburgerBtn.setAttribute('aria-expanded', String(isOpen));
        });

        function closeMobileMenu() {
            mobileMenu.classList.remove('open');
            pageHeader.classList.remove('menu-is-open');
            hamburgerBtn.setAttribute('aria-expanded', 'false');
        }

        window.addEventListener('scroll', () => {
            pageHeader.classList.toggle('scrolled', window.scrollY > 60);
        }, { passive: true });

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
    </script>
</body>

</html>
